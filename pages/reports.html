<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View reports and analytics for solar panel production and inventory.">
  <title>Analytics & Reports — SMAtree Solar</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/logo-icon-512.png">
  <link rel="shortcut icon" href="../assets/favicon.ico">
  <link rel="stylesheet" href="../css/variables.css?v=5.7">
  <link rel="stylesheet" href="../css/base.css?v=5.7">
  <link rel="stylesheet" href="../css/components.css?v=5.7">
  <link rel="stylesheet" href="../css/layout.css?v=5.7">
  <link rel="stylesheet" href="../css/reports.css?v=5.7">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="app" class="app-layout">
    <div class="main-content">
      <div class="page-content">
        <!-- Summary Cards -->
        <div class="reports-summary" id="reports-summary"></div>

        <!-- Filters -->
        <div class="report-filters" id="reports-filters"></div>

        <!-- Charts Grid -->
        <div class="report-charts">
          <div class="report-chart-card">
            <div class="card-header"><h3 class="card-title">Production Trend</h3></div>
            <div style="height:280px"><canvas id="report-chart-1"></canvas></div>
          </div>
          <div class="report-chart-card">
            <div class="card-header"><h3 class="card-title">Material Value (Top 6)</h3></div>
            <div style="height:280px"><canvas id="report-chart-2"></canvas></div>
          </div>
          <div class="report-chart-card">
            <div class="card-header"><h3 class="card-title">Installation Growth</h3></div>
            <div style="height:280px"><canvas id="report-chart-3"></canvas></div>
          </div>
          <div class="report-chart-card">
            <div class="card-header"><h3 class="card-title">Sales Breakdown</h3></div>
            <div style="height:280px"><canvas id="report-chart-4"></canvas></div>
          </div>
        </div>

        <!-- Data Table -->
        <div id="report-data"></div>
      </div>
    </div>
  </div>
  <script src="../js/utils.js?v=5.7"></script>
  <script src="../js/store.js?v=5.7"></script>
  <script src="../js/seed.js?v=5.7"></script>
  <script src="../api/config.js?v=5.7"></script>
  <script src="../api/service.js?v=5.7"></script>
  <script src="../js/icons.js?v=5.7"></script>
  <script src="../js/rbac.js?v=5.7"></script>
  <script src="../js/components.js?v=5.7"></script>
  <script src="../js/notifications.js?v=5.7"></script>
  <script src="../js/app.js?v=5.7"></script>
  <script src="../js/reports.js?v=5.7"></script>
  <script>document.addEventListener('DOMContentLoaded', () => Reports.init());</script>
</body>
</html>
