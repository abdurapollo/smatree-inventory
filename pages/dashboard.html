<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smatree Solar Inventory Dashboard — Monitor production, inventory, and installations in real-time.">
  <title>Dashboard — Smatree Solar Inventory</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="app" class="app-layout">
    <div class="main-content">
      <div class="page-content">
        <!-- Stats Grid -->
        <div class="stats-grid" id="stats-grid">
          <!-- Rendered by JS -->
        </div>

        <!-- Charts Row -->
        <div class="charts-row">
          <div class="chart-card">
            <div class="card-header">
              <h3 class="card-title">Monthly Production</h3>
              <span class="badge badge-primary">2026</span>
            </div>
            <div style="height:300px">
              <canvas id="production-chart"></canvas>
            </div>
          </div>
          <div class="chart-card">
            <div class="card-header">
              <h3 class="card-title">Material Value</h3>
              <span class="badge badge-neutral">By Category</span>
            </div>
            <div style="height:300px">
              <canvas id="material-chart"></canvas>
            </div>
          </div>
        </div>

        <!-- Comparison Chart Full Width -->
        <div class="chart-card mb-6">
          <div class="card-header">
            <h3 class="card-title">Manufactured vs Installed Panels</h3>
            <span class="badge badge-success">Trend</span>
          </div>
          <div style="height:280px">
            <canvas id="comparison-chart"></canvas>
          </div>
        </div>

        <!-- Bottom Row: Activity + Alerts -->
        <div class="bottom-row">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Recent Activity</h3>
              <span class="badge badge-neutral" id="activity-count">Latest</span>
            </div>
            <div class="activity-list" id="activity-list">
              <!-- Rendered by JS -->
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Low Stock Alerts</h3>
              <span class="badge badge-danger" id="alert-count">⚠️</span>
            </div>
            <div class="alert-list" id="alerts-list">
              <!-- Rendered by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/seed.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => Dashboard.init());</script>
</body>
</html>
